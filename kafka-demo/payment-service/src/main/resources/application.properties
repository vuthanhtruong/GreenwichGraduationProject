# ===== payment-service (PRODUCER) =====
spring.application.name=payment-service
server.port=8080

# Dia chi Kafka Broker. Khi chay local: localhost:9092.
# Khi chay trong Docker Compose, bien env KAFKA_BOOTSTRAP_SERVERS=kafka:29092 se override.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ===== Database (PostgreSQL chay trong docker-compose) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/paymentdb}
spring.datasource.username=${DB_USER:demo}
spring.datasource.password=${DB_PASSWORD:demo}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Log de quan sat producer
logging.level.com.demo.payment=INFO
